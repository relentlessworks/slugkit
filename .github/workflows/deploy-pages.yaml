name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save docs to temp
        run: |
          cp -r docs /tmp/docs

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Init gh-pages if needed
        run: |
          if [ ! -d gh-pages ]; then
            mkdir gh-pages
            cd gh-pages
            git init
            git config user.name "relentlessworks[bot]"
            git config user.email "noreply@relentlessworks.com"
            git checkout --orphan gh-pages
          else
            cd gh-pages
            git config user.name "relentlessworks[bot]"
            git config user.email "noreply@relentlessworks.com"
          fi

      - name: Deploy docs
        run: |
          cd gh-pages
          git rm -rf . 2>/dev/null || true
          cp -r /tmp/docs/* .
          git add -A
          git commit -m "Deploy docs from ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages 2>/dev/null || git push -u origin gh-pages
